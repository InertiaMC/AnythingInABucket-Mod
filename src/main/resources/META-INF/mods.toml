modLoader = "javafml"
loaderVersion = "${loader_compat}"
license = "MIT"

[[mods]]
modId = "${id}"
version = "${version}"
displayName = "${name}"
authors = "${author}"
displayURL = "https://modrinth.com/mod/anythinginabucket"
description = '''
${description}
'''
# Needed on the server only: clients without it can still join. With it, a player sees the bucket art with no pack.
displayTest = "IGNORE_ALL_VERSION"

[[dependencies.${id}]]
modId = "forge"
mandatory = true
versionRange = "${loader_compat}"
ordering = "NONE"
side = "BOTH"

[[dependencies.${id}]]
modId = "minecraft"
mandatory = true
versionRange = "${minecraft}"
ordering = "NONE"
side = "BOTH"
